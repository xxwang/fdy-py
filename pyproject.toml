[project]
name = "fdy"
description = "日常开发工具库"
readme = "README.md"
license = "MIT"
authors = [
    { name = "xxwang", email = "78023776@qq.com" }
]
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = [
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
http = [
    "httpx>=0.28.1",
]
web = [
    "fastapi>=0.115",
    "starlette>=0.40",
]
gui = [
    # 6.10 是首个支持 Python 3.14 的 PySide6 版本，下限不可下调
    "PySide6>=6.10",
]
all = [
    "fdy[http]",
    "fdy[web]",
    "fdy[gui]",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/fdy"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import 排序)
    "N",      # pep8-naming
    "UP",     # pyupgrade (语法升级)
    "B",      # flake8-bugbear (常见 bug)
    "SIM",    # flake8-simplify (代码简化)
    "ASYNC",  # flake8-async (异步最佳实践) ← FastAPI 项目必开！
    "RUF",    # Ruff 专属规则
]

ignore = [
    "E501",  # 行长度由 formatter 控制
    "RUF001",  # 中文日志/文案中的全角标点属正常用法
    "RUF002",  # 中文 docstring 中的全角标点属正常用法
    "RUF003",  # 中文注释中的全角标点属正常用法
    "B008",  # FastAPI 中 Depends(get_session) 的标准写法，非 bug
    "N818",  # 异常名有意用 APIException（与 APIResponse 成对），不改名
    "W293"
]

[tool.ruff.lint.isort]
known-first-party = ["fdy"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
